[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electrowinning-rl"
version = "0.1.0"
description = "Surrogate-assisted constrained reinforcement learning for electrowinning setpoint optimization"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.13,<2",
  "scikit-learn>=1.7,<2", "joblib>=1.4,<2", "torch>=2.5,<3",
  "gymnasium>=1.0,<2", "pymoo>=0.6.1.5,<0.7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9"]

[project.scripts]
ewrl = "electrowinning_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
